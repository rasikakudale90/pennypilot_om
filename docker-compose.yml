name: pennypilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: pennypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pennypilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pennypilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pennypilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./database/migrations:/flyway/migrations:ro
    networks:
      - pennypilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pennypilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT}/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - pennypilot-frontend-node-modules:/app/node_modules
    networks:
      - pennypilot-network

networks:
  pennypilot-network:
    driver: bridge

volumes:
  pennypilot-postgres-data:
  pennypilot-frontend-node-modules:
