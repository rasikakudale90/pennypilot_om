name: pennypilot

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pennypilot-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./database/migrations:/flyway/migrations:ro
    networks:
      - pennypilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pennypilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT}/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - pennypilot-frontend-node-modules:/app/node_modules
    networks:
      - pennypilot-network

networks:
  pennypilot-network:
    driver: bridge

volumes:
  pennypilot-frontend-node-modules: